<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Expose TeXLive Computer Modern Unicode (CMU Serif) to Cairo/R.
     Used via FONTCONFIG_FILE when building R/Cairo figures. -->
<fontconfig>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/cm-unicode</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
